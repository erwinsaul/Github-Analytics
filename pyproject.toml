[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Github-Analytics"
version = "0.1.0"
description = "Github Analytics"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Erwin Saul", email = "erwinsaul.sc@gmail.com" }
]
dependencies = [
    "httpx>=0.23.3",
    "pandas>=2.0.0",
    "duckdb>=0.10.2",
    "pydantic>=2.7.0",
    "python-settings>=2.2.0",
    "streamlit>=1.34.0",
    "plotly>=5.22.0",
    "pyarrow>=16.0.0",
    "tenacity>=8.3.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src/github_analytics --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["github_analytics"]